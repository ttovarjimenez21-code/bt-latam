<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar producto - BT LATAM TEC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles(1).css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
<div class="container" style="padding:30px 15px;">
  {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
  <div class="bt-simple-panel">
    <h1 class="section__title">Editar producto</h1>
    <form method="post">
      <div class="bt-simple-grid">
        <input name="name" value="{{ producto.name }}" required>
        <input name="brand" value="{{ producto.brand }}">
        <input name="category" value="{{ producto.category }}" required>
        <input name="price" type="number" step="0.01" value="{{ producto.price }}" required>
        <input name="original_price" type="number" step="0.01" value="{{ producto.original_price or '' }}">
        <input name="icon" value="{{ producto.icon or '' }}">
        <input name="rating" type="number" step="0.1" min="0" max="5" value="{{ producto.rating }}">
        <input name="reviews" type="number" min="0" value="{{ producto.reviews }}">
        <input name="badge" value="{{ producto.badge or '' }}">
        <input name="shipping" value="{{ producto.shipping or '' }}">
        <textarea name="description">{{ producto.description or '' }}</textarea>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn--primary" type="submit">Actualizar</button>
        <a class="btn btn--ghost" href="{{ url_for('crud') }}">Volver</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
